# Build and publish the Kasm-MobSF workspace image to GitHub Packages container registry.
name: Create and publish a Docker image

# Triggers: on push to release branch, nightly schedule, or manual run via Actions tab.
on:
  push:
    branches: ['release'] # Build on push to release branch
  schedule:
    - cron: '0 0 * * *' # Nightly rebuild at midnight UTC for rolling-daily image updates
  workflow_dispatch: # Allow manual runs from the Actions tab

env:
  REGISTRY: ghcr.io # GitHub Container Registry domain
  IMAGE_NAME: ${{ github.repository_owner }}/kasm-mobsf # Full image name including owner

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      #
    steps:
      # Always checkout the release branch for all triggers
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release # Enforces release branch usage on scheduled runs, which default to main
      # Authenticate to the GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # For nightly and manual builds: fetch the latest release tag for rolling-daily image tags
      - name: Get latest release tag
        if: github.event_name == 'schedule' || github.event_name =='workflow_dispatch'
        id: get_latest_release
        uses: actions/github-script@v7
        with:
          script: |
            const latestRelease = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.setOutput('release_tag', latestRelease.data.tag_name);
      # Extract Docker metadata (labels, tags) for the image
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Use branch ref for release branch pushes
            type=ref,event=branch
            # For rolling-daily (scheduled or manual runs), use latest release version plus -rolling-daily
             ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('{0}-rolling-daily', steps.get_latest_release.outputs.release_tag) || '' }}
      # Build and push the Docker image to the registry
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: kasm-mobsf-image # Build context (source directory)
          file: kasm-mobsf-image/dockerfile-kasm-mobsf # Path to Dockerfile (relative to context)
          push: true # Push the built image
          tags: ${{ steps.meta.outputs.tags }} # Use tags from metadata step
          labels: ${{ steps.meta.outputs.labels }} # Use labels from metadata step
      
      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see [Using artifact attestations to establish provenance for builds](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds).
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      
